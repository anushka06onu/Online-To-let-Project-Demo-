<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}">
  <title>Available Flats - StaySquare</title>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container section">
    <h1 class="text-center mb-4 section-title">Available Flats/Rooms</h1>

    <div class="row justify-content-center g-4">
        <th:block th:each="flat: ${flats}">
            <div class="col-md-4">
                <div class="card glass">
                    <h3 class="text-center mb-3"><strong><span th:text="${flat.tenantGender}"></span> Room Available</strong></h3>
                    <ul class="list-unstyled">
                        <li><strong>No of Rooms:</strong> <span th:text="${flat.noOfRoom}"></span></li>
                        <li><strong>Available Date:</strong> <span th:text="${flat.availableDate}"></span></li>
                        <li><strong>Monthly Rent:</strong> <span th:text="${flat.rent}"></span></li>
                    </ul>
                    <div class="text-center mt-3">
                        <a class="nav-link btn-primary d-inline-block text-center" style="width: auto;" th:href="@{|/${flat.id}/detail|}">Details</a>
                    </div>
                </div>
            </div>
        </th:block>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
</body>
</html>
