<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}">
  <title>Tenant Registration - StaySquare</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container section">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card glass">
                <h2 class="text-center mb-4 section-title">Tenant Registration</h2>
                <form th:action="@{/tenant/registration}" th:method="post" th:object="${user}">

                    <div style="color:red;" class="mb-3" th:if="${msg}">
                        <p class="alert alert-danger">[[${msg}]]</p>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email:</label>
                        <p style="color:red;" th:if="${#fields.hasErrors('userEmail')}" th:errors="*{userEmail}"></p>
                        <input type="email" id="email" name="userEmail" class="form-control" placeholder="Enter your email" required th:value="*{userEmail}">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password:</label>
                        <p style="color:red;" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Enter a password" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirm Password:</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Confirm your password" required>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="nav-link btn-primary text-center">Register</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
</body>
</html>
